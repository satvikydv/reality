<!doctype html>
<html lang="en" data-theme="laptop"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reality OS · Dashboard</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/inspector.css">
<style>
:root{--blue:#8ab4ff}
body{background:radial-gradient(circle at 30% 45%,#10151a,#07090b 70%);overflow:auto}
#app{position:fixed;inset:0;min-width:1100px;min-height:640px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:16px;padding:18px 24px 22px}
header{display:flex;align-items:center;gap:22px}
.brand{font:700 22px var(--sans);display:flex;align-items:center;gap:12px;letter-spacing:.02em}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 16px var(--accent)}
.pill{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:99px;font:500 12px var(--mono);letter-spacing:.06em;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}.dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}
#phase{font:500 13px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.cnt{display:flex;gap:12px;margin-left:auto}
.cnt>div{padding:10px 18px;min-width:118px}.cnt b{display:block;font:600 28px/1 var(--mono);margin-top:9px}
main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(380px,1fr);gap:16px;min-height:0}
.col{display:grid;gap:16px;min-height:0;min-width:0}
.col>*{min-width:0}
.left{grid-template-rows:minmax(0,1fr) 372px}.right{grid-template-rows:auto minmax(0,1fr)}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--accent-line);background-clip:content-box}::-webkit-scrollbar-corner{background:transparent}
.map{position:relative;padding:16px;min-height:0}
#mapc{position:absolute;inset:16px;width:calc(100% - 32px);height:calc(100% - 32px)}
.map .label{position:absolute;left:20px;top:18px;z-index:1}.map .big{position:absolute;right:22px;top:14px;font:700 34px var(--mono);color:var(--green);z-index:1}
.hist{padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,button.small{font:600 13px var(--sans);color:var(--ink);background:var(--fill-1);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:0 16px;min-height:var(--tap-min)}
select{font-family:var(--mono);font-weight:500;padding:0 12px}select option{color:#000}
button.small{cursor:pointer}button.small.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
#chsum{font:500 14px/1.4 var(--sans);color:var(--dim)}
#cards{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding-bottom:6px;min-width:0;max-width:100%;flex:1;min-height:0}
.card{flex:0 0 250px;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .15s,background .15s,transform .15s;overflow:hidden;text-align:left;color:inherit;font:inherit}
.card:hover,.card:focus-visible{border-color:var(--accent);background:var(--accent-fill);transform:translateY(-2px);outline:none}
.card .open{margin-top:auto;font:500 10px var(--mono);letter-spacing:.12em;color:var(--dim)}.card:hover .open{color:var(--accent)}
.empty{margin:auto;color:var(--dim);font:400 14px var(--sans)}
/* full view of one change */
#viewer{position:fixed;inset:0;z-index:20;display:none;background:rgba(5,7,9,.88);backdrop-filter:blur(8px);padding:28px 36px;min-width:1100px}
#viewer.on{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:18px;animation:fade .18s}
@keyframes fade{from{opacity:0}}
#viewer .vh{display:flex;align-items:center;gap:14px}
#viewer .vt{font:600 22px var(--sans);display:flex;align-items:center;gap:12px;min-width:0}
#viewer .vt i{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:700 17px var(--mono);font-style:normal;color:#07090b;flex:none}
#viewer .vn{margin-left:auto;font:500 13px var(--mono);color:var(--dim);letter-spacing:.08em}
#viewer .nav{display:flex;gap:8px}
#viewer .vb{display:grid;gap:18px;min-height:0;grid-template-columns:1fr 1fr}.vb.one{grid-template-columns:minmax(0,760px);justify-content:center}
.vslot{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.vslot .label{display:block}
.vslot .frame{position:relative;flex:1;min-height:0;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#111}
.vslot canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vslot .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font:400 14px var(--sans)}
#viewer .vf{font:400 17px/1.5 var(--sans);max-width:980px}
button.small:disabled{opacity:.35;cursor:default}
.card h3{margin:0;font:600 13px var(--sans);display:flex;gap:8px;align-items:center}
.card h3 i{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font:700 13px var(--mono);font-style:normal;color:#07090b}
.card p{margin:0;font:400 12.5px/1.4 var(--sans);color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}.pair canvas{width:100%;aspect-ratio:4/3;border-radius:8px;background:#111;display:block}
.pair.one>div{grid-column:1}
.pair span{font:500 9px var(--mono);letter-spacing:.12em;color:var(--dim);display:block;margin-bottom:3px}
.ag{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.ag .head{display:flex;align-items:center;gap:10px}.ag .head i{width:9px;height:9px;border-radius:50%;background:#555}.ag.on .head i{background:var(--blue);box-shadow:0 0 10px var(--blue)}
.ag .q{font:600 20px/1.3 var(--mono);color:var(--blue);word-break:break-word}.ag .a{font:400 16px/1.45 var(--sans);color:var(--ink);border-top:1px solid var(--line);padding-top:10px;min-height:44px}
.ag .meta{font:500 11px var(--mono);color:var(--dim)}
#agphoto{width:100%;aspect-ratio:16/9;border-radius:12px;background:#111;display:none}
.prev{display:flex;flex-direction:column;gap:4px;font:400 12px/1.4 var(--mono);color:var(--dim)}.prev b{color:var(--blue);font-weight:500}
.log{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-height:0}
#log{display:flex;flex-direction:column;gap:7px;overflow:auto;min-height:0}
.l{font:400 13px/1.4 var(--mono);display:flex;gap:10px;animation:in .35s}.l time{flex:0 0 66px;color:var(--dim)}.l .t{flex:0 0 52px;font-weight:700;letter-spacing:.06em}
.l.phone .t{color:var(--accent)}.l.agent .t{color:var(--blue)}.l.srv .t{color:var(--dim)}.l.good{color:var(--green)}.l.bad{color:var(--red)}.l span.m{min-width:0;word-break:break-word}
@keyframes in{from{opacity:0;transform:translateX(10px)}}
</style></head><body>
<div id="app">
<header>
  <div class="brand"><i></i>Reality OS</div>
  <span id="phase">Waiting for a scan</span>
  <button class="small go" id="objbtn" title="Review and correct what the memory believes">Objects</button>
  <span class="pill panel"><span class="dot" id="conn"></span><span id="connt">connecting…</span></span>
  <div class="cnt">
    <div class="panel"><span class="label">Frames</span><b id="cf">0</b></div>
    <div class="panel"><span class="label">Objects</span><b id="co" style="color:var(--accent)">0</b></div>
    <div class="panel"><span class="label">Seconds</span><b id="cs">0</b></div>
    <div class="panel"><span class="label">Cost</span><b id="cu">$0.000</b></div>
  </div>
</header>
<main>
  <div class="col left">
    <div class="map panel"><span class="label">Room map · compass, north up · distance from centre = pitch</span><span class="big" id="cp">0%</span><canvas id="mapc"></canvas></div>
    <div class="hist panel">
      <div class="bar"><span class="label">Compare scans</span>
        <select id="sa" title="before"></select><span class="label">→</span><select id="sb" title="after"></select>
        <button class="small go" id="cmp">What changed?</button><button class="small" id="clr" hidden>Clear</button><span id="chsum"></span></div>
      <div id="cards"></div>
    </div>
  </div>
  <div class="col right">
    <div class="ag panel" id="ag">
      <div class="head"><i></i><span class="label" id="aglabel">Agent · waiting for an external AI</span></div>
      <div class="q" id="aq">no agent has asked anything yet</div>
      <div class="a" id="aa"></div>
      <canvas id="agphoto"></canvas>
      <div class="meta" id="agmeta"></div>
      <div class="prev" id="prev"></div>
    </div>
    <div class="log panel"><span class="label">Event log</span><div id="log"></div></div>
  </div>
</main>
</div>
<div id="viewer" role="dialog" aria-modal="true" aria-label="Change details">
  <div class="vh">
    <button class="small" id="vback">‹ Back</button>
    <div class="vt"><i id="vi"></i><span id="vtitle"></span></div>
    <span class="vn" id="vcount"></span>
    <div class="nav"><button class="small" id="vprev" aria-label="Previous">‹</button><button class="small" id="vnext" aria-label="Next">›</button></div>
  </div>
  <div class="vb" id="vbody"></div>
  <div class="vf" id="vtext"></div>
</div>
<section id="insp" role="dialog" aria-modal="true" aria-label="Objects inspector">
  <div class="ih"><h1>Objects</h1>
    <select id="irooms" aria-label="Room"></select><select id="iscans" aria-label="Scan"></select>
    <button class="small" id="idups">Possible duplicates (0)</button><button class="small" id="ilog">Corrections log</button>
    <span class="hide" id="isum"></span><span id="imsg" role="status" style="font:500 13px var(--mono);color:var(--accent)"></span><button class="small grow" id="iclose">Close ✕</button></div>
  <div class="im">
    <div class="pane panel" id="ilabels"></div>
    <div class="pane panel" id="iinst"></div>
    <div class="pane panel"><div class="detail" id="idetail"></div></div>
  </div>
</section>
<script type="module" src="js/dashboard.js"></script>
<script type="module" src="js/inspector.js"></script>
</body></html>
